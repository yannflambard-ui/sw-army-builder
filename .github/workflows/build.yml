name: Build APK

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      build_aab:
        description: 'Générer aussi l AAB signé (format Play Store)'
        type: boolean
        required: false
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -5

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Décoder le keystore stable (base64) pour signer le debug APK avec une clé
      # CONSTANTE -> l'utilisateur peut mettre à jour l'app sans désinstaller.
      - name: Decode stable signing keystore
        run: |
          echo "$KS" | base64 -d > app/keystore.jks
        env:
          KS: ${{ secrets.LEGIONFORGE_KEYSTORE }}

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      # Garde-fou i18n : détecte les formats % non échappés (crash FR/DE/ES).
      - name: Validate localized string formats
        run: python3 scripts/check_string_formats.py

      # ── Garde-fou visuel : comparer les écrans aux goldens Roborazzi (sans appareil) ──
      - name: Verify UI snapshots (Roborazzi)
        run: ./gradlew :app:verifyRoborazziDebug --no-daemon

      - name: Upload UI snapshots + report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legion-forge-ui-snapshots
          path: |
            app/src/test/snapshots/*.png
            app/build/reports/roborazzi/**

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: legion-forge-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      # ── AAB signé pour le Play Store (même keystore stable que l'APK) ──
      - name: Build signed release AAB
        if: inputs.build_aab
        run: ./gradlew bundleRelease --no-daemon

      - name: Verify AAB signature
        if: inputs.build_aab
        shell: bash
        run: |
          set -euo pipefail
          AAB=$(find app/build/outputs/bundle/release -name '*.aab' | head -1)
          test -s "$AAB"
          echo "AAB: $AAB"
          # L'AAB est signé en JAR (META-INF/<alias>.RSA), pas en APK v2 : keytool -jarfile
          # ne fonctionne pas. On extrait le certificat du zip puis on l'imprime.
          RSA_PATH=$(unzip -Z1 "$AAB" | grep -E '^META-INF/.*\.RSA$' | head -1)
          test -n "$RSA_PATH" || { echo "AUCUN CERTIFICAT DE SIGNATURE DANS L'AAB" >&2; exit 1; }
          unzip -p "$AAB" "$RSA_PATH" > /tmp/release-cert.RSA
          keytool -printcert -file /tmp/release-cert.RSA | grep -E 'Owner:|SHA256:'
          echo "Signature AAB vérifiée ($RSA_PATH)"

      - name: Upload signed AAB
        if: inputs.build_aab
        uses: actions/upload-artifact@v4
        with:
          name: legion-forge-release-aab
          path: app/build/outputs/bundle/release/*.aab

      # ── Release notes GitHub : notes générées à chaque build master/main ──
      - name: Create GitHub Release with release notes
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -e
          VERSION="$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)"
          TAG="v${VERSION}"
          REPO="$GITHUB_REPOSITORY"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG existe deja, skip creation."
            exit 0
          fi
          PREV_TAG="$(gh release list --repo "$REPO" --limit 1 --json tagName --jq '.[0].tagName // empty' 2>/dev/null || true)"
          if [ -n "$PREV_TAG" ]; then
            NOTES="$(gh api "/repos/$REPO/compare/$PREV_TAG...$TAG" --jq '.commits[] | "- " + (.commit.message | split("\n")[0])' 2>/dev/null || echo "Changements non listes.")"
          else
            NOTES="- Premiere version publique de SW Army Builder v${VERSION}."
          fi
          printf 'SW Army Builder v%s\n\n%s\n\nAPK : legion-forge-debug.apk ci-joint.\n' "$VERSION" "$NOTES" > /tmp/release_notes.txt
          gh release create "$TAG" \
            app/build/outputs/apk/debug/app-debug.apk \
            --repo "$REPO" \
            --title "SW Army Builder $VERSION" \
            --notes-file /tmp/release_notes.txt
        env:
          GH_TOKEN: ${{ github.token }}
