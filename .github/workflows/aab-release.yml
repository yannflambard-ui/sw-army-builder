name: Release AAB (Google Play)

on:
  workflow_dispatch:
    inputs:
      notes:
        description: 'Notes de release (optionnel)'
        required: false
        default: ''

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -5

      - name: Grant execute permission
        run: chmod +x gradlew

      # Keystore stable = même clé que l'APK déjà diffusé sur le Drive.
      # Secret LEGIONFORGE_KEYSTORE déjà présent dans le repo : aucun ajout nécessaire.
      - name: Decode stable signing keystore
        env:
          KS: ${{ secrets.LEGIONFORGE_KEYSTORE }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::Secret LEGIONFORGE_KEYSTORE manquant."
            exit 1
          fi
          echo "$KS" | base64 -d > app/keystore.jks
          test -s app/keystore.jks

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Verify UI snapshots (Roborazzi)
        run: ./gradlew :app:verifyRoborazziDebug --no-daemon

      - name: Build signed release AAB
        run: ./gradlew bundleRelease --no-daemon

      - name: Verify AAB is signed
        run: |
          AAB=$(find app/build/outputs/bundle/release -name '*.aab' | head -1)
          echo "AAB: $AAB"
          test -s "$AAB"
          keytool -list -printcert -jarfile "$AAB" | grep -i 'Owner:' | head -1

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: legion-forge-release-aab
          path: app/build/outputs/bundle/release/*.aab

      # Téléversement Play Console : à activer quand le compte de service sera fourni.
      # - name: Upload to Play Store
      #   ...
